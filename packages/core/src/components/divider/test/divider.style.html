<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="ds-container">
      <!-- Basic Style -->
      <section data-testid="basic">
        <span>Basic</span>
        <hr />
        <br />
        <br />
        <hr class="ds-divider" />
      </section>

      <!-- Colors -->
      <section data-testid="colors">
        <span>Colors</span>
        <hr class="ds-divider has-space-sm is-primary" />
        <hr class="ds-divider has-space-sm is-secondary" />
        <hr class="ds-divider has-space-sm is-default" />
        <hr class="ds-divider has-space-sm is-inverted" />
      </section>

      <!-- Dashed -->
      <section data-testid="dashed">
        <span>Dashed</span>
        <hr class="ds-divider has-space-sm is-dashed is-primary" />
        <hr class="ds-divider has-space-sm is-dashed is-secondary" />
        <hr class="ds-divider has-space-sm is-dashed is-default" />
        <hr class="ds-divider has-space-sm is-dashed is-inverted" />
      </section>

      <section data-testid="dashed-vertical" style="display: flex; height: 8rem">
        <span>Dashed Vertical</span>
        <hr class="ds-divider has-space-sm is-vertical is-dashed is-primary" />
        <hr class="ds-divider has-space-sm is-vertical is-dashed is-secondary" />
        <hr class="ds-divider has-space-sm is-vertical is-dashed is-default" />
        <hr class="ds-divider has-space-sm is-vertical is-dashed is-inverted" />
      </section>

      <!-- Horizontal -->
      <section data-testid="horizontal">
        <span>Horizontal</span>
        <hr class="ds-divider is-horizontal" />

        <hr class="ds-divider is-horizontal has-space-none" />
        <hr class="ds-divider is-horizontal has-space-sxs" />
        <hr class="ds-divider is-horizontal has-space-xs" />
        <hr class="ds-divider is-horizontal has-space-sm" />
        <hr class="ds-divider is-horizontal has-space-base" />
        <hr class="ds-divider is-horizontal has-space-md" />
        <hr class="ds-divider is-horizontal has-space-lg" />
        <hr class="ds-divider is-horizontal has-space-xl" />
        <hr class="ds-divider is-horizontal has-space-2xl" />
        <hr class="ds-divider is-horizontal has-space-3xl" />
      </section>

      <!-- Vertical -->
      <section data-testid="vertical" style="display: flex; height: 8rem">
        <span>Vertical</span>
        <hr class="ds-divider is-vertical" />

        <hr class="ds-divider is-vertical has-space-none" />
        <hr class="ds-divider is-vertical has-space-2xs" />
        <hr class="ds-divider is-vertical has-space-xs" />
        <hr class="ds-divider is-vertical has-space-sm" />
        <hr class="ds-divider is-vertical has-space-base" />
        <hr class="ds-divider is-vertical has-space-md" />
        <hr class="ds-divider is-vertical has-space-lg" />
        <hr class="ds-divider is-vertical has-space-xl" />
        <hr class="ds-divider is-vertical has-space-2xl" />
        <hr class="ds-divider is-vertical has-space-3xl" />
      </section>
    </main>
  </body>
</html>
