<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="ds-container">
      <!-- Basic Style -->
      <section data-testid="basic">
        <span>Basic</span>
        <button class="ds-button">Button</button>
      </section>

      <!-- Colors -->
      <section data-testid="colors">
        <span>Colors</span>
        <button class="ds-button is-primary">Primary</button>
        <button class="ds-button is-secondary">Secondary</button>
        <button class="ds-button is-tertiary">Tertiary</button>
        <button class="ds-button is-ghost">Ghost</button>

        <br />
        <br />

        <button class="ds-button is-brand-purple">Brand Purple</button>
        <button class="ds-button is-brand-red">Brand Red</button>
        <button class="ds-button is-brand-yellow">Brand Yellow</button>
        <button class="ds-button is-brand-green">Brand Green</button>

        <br />
        <br />
        <button class="ds-button is-info">Info</button>
        <button class="ds-button is-success">Success</button>
        <button class="ds-button is-warning">Warning</button>
        <button class="ds-button is-danger">Danger</button>
      </section>

      <!-- Inverted -->
      <section data-testid="inverted" class="s-bg-inverted">
        <span>Inverted</span>
        <button class="ds-button is-inverted is-primary">Primary</button>
        <button class="ds-button is-inverted is-secondary">Secondary</button>
        <button class="ds-button is-inverted is-tertiary">Tertiary</button>
        <button class="ds-button is-inverted is-ghost">Ghost</button>

        <br />
        <br />

        <button class="ds-button is-inverted is-brand-purple">Brand Purple</button>
        <button class="ds-button is-inverted is-brand-red">Brand Red</button>
        <button class="ds-button is-inverted is-brand-yellow">Brand Yellow</button>
        <button class="ds-button is-inverted is-brand-green">Brand Green</button>

        <br />
        <br />
        <button class="ds-button is-inverted is-info">Info</button>
        <button class="ds-button is-inverted is-success">Success</button>
        <button class="ds-button is-inverted is-warning">Warning</button>
        <button class="ds-button is-inverted is-danger">Danger</button>
      </section>

      <!-- Brand Icons -->
      <section data-testid="brand-icons">
        <span>Brand Icons</span>
        <div class="ds-stack as-row">
          <button class="ds-button is-brand-purple has-brand-icon">
            <ds-brand-icon src="/assets/images/brand-icons/electric-car-ins-purple.svg" color="purple" size="md">
            </ds-brand-icon>
            Elektrische autoverzekering
          </button>
          <button class="ds-button is-brand-yellow has-brand-icon">
            <ds-brand-icon src="/assets/images/brand-icons/car-tangerine.svg" color="yellow" size="md"></ds-brand-icon>
            Autoverzekering
          </button>
          <button class="ds-button is-brand-red has-brand-icon">
            <ds-brand-icon src="/assets/images/brand-icons/motorbike-red.svg" color="red" size="md"></ds-brand-icon>
            Motorverzekering
          </button>
          <button class="ds-button is-brand-green has-brand-icon">
            <ds-brand-icon src="/assets/images/brand-icons/camper-green.svg" color="green" size="md"></ds-brand-icon>
            Verzekering mobilhome
          </button>
        </div>
      </section>

      <!-- Shadow -->
      <section data-testid="shadow" class="s-bg-2">
        <span>Shadow</span>
        <button class="ds-button has-shadow">Button</button>
        <a class="ds-button is-link has-shadow" href="">Link Button</a>
      </section>

      <!-- Badge Style -->
      <section data-testid="badge">
        <span>Badge</span>
        <button class="ds-button">
          <ds-badge>42</ds-badge>
          Button
        </button>
      </section>

      <!-- Link -->
      <section data-testid="link">
        <span>Link</span>
        <button class="ds-button is-link">Link Button</button>
        <a class="ds-link" href="">Link Button</a>
        <br />
        <br />
        <div class="s-bg-inverted">
          <button class="ds-button is-link is-inverted">Link Button</button>
          <a class="ds-link is-inverted" href="">Link Button</a>
        </div>
      </section>

      <!-- Sizes -->
      <section data-testid="sizes">
        <span>Sizes</span>
        <button class="ds-button is-small">Small</button>
        <button class="ds-button">Normal</button>
        <button class="ds-button is-large">Large</button>
      </section>

      <!-- Wide -->
      <section data-testid="wide">
        <span>Wide</span>
        <button class="ds-button is-wide">
          <ds-icon name="plus"></ds-icon>
          Fullwidth
        </button>
      </section>

      <!-- Long Content -->
      <section data-testid="long-content">
        <span>Long Content</span>
        <button class="ds-button">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi maxime, ut dolores laudantium est aut
          aperiam rem voluptates suscipit praesentium pariatur harum repellat excepturi expedita similique qui nemo
          totam assumenda.
        </button>
        <button class="ds-button has-no-wrap">Lorem ipsum</button>
        <button class="ds-button has-no-wrap">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi maxime, ut dolores laudantium est aut
          aperiam rem voluptates suscipit praesentium pariatur harum repellat excepturi expedita similique qui nemo
          totam assumenda.
        </button>
      </section>

      <!-- Flat -->
      <section data-testid="flat">
        <span>Flat</span>
        <button class="ds-button is-flat">Flat Button</button>
      </section>

      <!-- Disabled -->
      <section data-testid="disabled">
        <span>Disabled</span>
        <button class="ds-button" disabled="disabled">Disabled using attribute</button>
        <button class="ds-button is-disabled" tabindex="-1" role="button" aria-disabled="true">
          Disabled using class name
        </button>
      </section>

      <!-- Buttons with any HTML tags -->
      <section data-testid="html-tags">
        <span>Buttons with any HTML tags</span>
        <form>
          <a role="button" class="ds-button">Link</a>
          <button type="submit" class="ds-button">Button</button>
          <input type="button" value="Input" class="ds-button" />
          <input type="submit" value="Submit" class="ds-button" />
          <input type="radio" aria-label="Radio" class="ds-button" />
          <input type="checkbox" aria-label="Checkbox" class="ds-button" />
          <input type="reset" value="Reset" class="ds-button" />
        </form>
      </section>

      <!-- Square -->
      <section data-testid="square">
        <span>Square</span>
        <button class="ds-button is-square">
          <ds-icon name="check"></ds-icon>
        </button>

        <br />
        <br />
        <button class="ds-button is-square is-small">
          <ds-icon name="check"></ds-icon>
        </button>
      </section>

      <!-- Icon -->
      <section data-testid="icon">
        <span>Icon</span>
        <button class="ds-button">
          <ds-icon name="plus"></ds-icon>
          Button
        </button>
        <button class="ds-button is-secondary">
          Button
          <ds-icon name="plus"></ds-icon>
        </button>
      </section>

      <!-- Loading -->
      <section data-testid="loading">
        <span>Loading</span>
        <div class="ds-buttons">
          <button class="ds-button is-square is-loading is-primary">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-loading">
            <ds-spinner></ds-spinner>
            loading...
          </button>
          <button class="ds-button is-square is-loading is-primary">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-loading">
            <ds-spinner></ds-spinner>
            loading...
          </button>
        </div>
        <div class="ds-buttons">
          <button class="ds-button is-square is-loading" disabled>
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-secondary is-loading" disabled>
            <ds-spinner></ds-spinner>
            loading...
          </button>

          <button class="ds-button is-square is-loading" disabled>
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-secondary is-loading" disabled>
            <ds-spinner></ds-spinner>
            loading...
          </button>
        </div>
        <div class="ds-buttons">
          <button class="ds-button is-square is-loading inset-ring-secondary">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-tertiary">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-ghost">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-brand-purple">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-brand-green">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-brand-red">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-brand-yellow">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-info">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-success">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-warning">
            <ds-spinner></ds-spinner>
          </button>
          <button class="ds-button is-square is-loading is-danger">
            <ds-spinner></ds-spinner>
          </button>
        </div>
      </section>

      <!-- Group -->
      <section data-testid="group">
        <span>Group</span>
        <div class="ds-buttons">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
        <div class="ds-buttons is-centered">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
        <div class="ds-buttons is-right">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
      </section>

      <!-- Two Row Button Group -->
      <section data-testid="two-row-button-group">
        <span>Two Row Button Group</span>
        <div class="ds-buttons as-row fit-content">
          <button class="ds-button">Left</button>
          <button class="ds-button">Right</button>
        </div>
        <div class="ds-buttons as-row">
          <button class="ds-button is-square">
            <ds-icon name="plus"></ds-icon>
          </button>
          <button class="ds-button">Right</button>
        </div>
      </section>

      <!-- Group Column-->
      <section data-testid="group-column">
        <span>Group Column</span>
        <div class="ds-buttons as-col">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
        <div class="ds-buttons as-col is-centered">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
        <div class="ds-buttons as-col is-right">
          <button class="ds-button">Left</button>
          <button class="ds-button">Middle</button>
          <button class="ds-button">Right</button>
        </div>
      </section>
    </main>
  </body>
</html>
