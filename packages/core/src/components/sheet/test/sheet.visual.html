<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <ds-app>
      <main class="container py-medium">
        <!-- Basic -->
        <section data-testid="basic">
          <span>Basic</span>
          <ds-sheet style="position: relative">
            <ds-heading level="h4" space="bottom">BaloiseCombi</ds-heading>
            <p class="text-normal mb-normal">
              Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et
              dolore magna aliqua.
            </p>
            <ds-button-group direction="auto" align="right" space="top">
              <ds-button>Main Action</ds-button>
              <ds-button color="secondary">Secondary Action</ds-button>
            </ds-button-group>
          </ds-sheet>
        </section>

        <!-- Container (enum) -->
        <section data-testid="container" style="display: flex; flex-direction: column; gap: 1rem">
          <span>Container</span>
          <ds-sheet style="position: relative">
            <ds-heading level="h4" space="bottom">Default</ds-heading>
            <p class="text-normal">Default container width.</p>
          </ds-sheet>
          <ds-sheet style="position: relative" container-size="fluid">
            <ds-heading level="h4" space="bottom">Fluid</ds-heading>
            <p class="text-normal">Full width container.</p>
          </ds-sheet>
          <ds-sheet style="position: relative" container-size="compact">
            <ds-heading level="h4" space="bottom">Compact</ds-heading>
            <p class="text-normal">Narrow container width.</p>
          </ds-sheet>
        </section>
      </main>
    </ds-app>
  </body>
</html>
