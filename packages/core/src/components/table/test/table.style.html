<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <!-- Basic -->
      <section data-testid="basic">
        <span>Basic</span>
        <table class="table is-wide">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Alice</td>
              <td>Admin</td>
              <td>Active</td>
            </tr>
            <tr>
              <td>Bob</td>
              <td>Editor</td>
              <td>Inactive</td>
            </tr>
            <tr>
              <td>Carol</td>
              <td>Viewer</td>
              <td>Active</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Striped -->
      <section data-testid="striped">
        <span>Striped</span>
        <table class="table is-wide is-striped is-hoverable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Alice</td>
              <td>Admin</td>
              <td>Active</td>
            </tr>
            <tr>
              <td>Bob</td>
              <td>Editor</td>
              <td>Inactive</td>
            </tr>
            <tr>
              <td>Carol</td>
              <td>Viewer</td>
              <td>Active</td>
            </tr>
            <tr>
              <td>Dave</td>
              <td>Admin</td>
              <td>Active</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Narrow -->
      <section data-testid="narrow">
        <span>Narrow</span>
        <table class="table is-narrow">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Alice</td>
              <td>Admin</td>
            </tr>
            <tr>
              <td>Bob</td>
              <td>Editor</td>
            </tr>
            <tr>
              <td>Carol</td>
              <td>Viewer</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
