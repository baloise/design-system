<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/tokens/base.tokens.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <link rel="stylesheet" href="/assets/css/utilities.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="ds-container">
      <!-- Basic -->
      <section data-testid="basic">
        <span>Basic</span>
        <ds-phone-input label="Phone number"></ds-phone-input>
        <ds-phone-input label="Phone number" initial-country="CH"></ds-phone-input>
        <ds-phone-input label="Phone number" initial-country="CH" placeholder="79 501 21 22"></ds-phone-input>
      </section>

      <!-- Countries -->
      <section data-testid="countries">
        <span>Countries</span>
        <ds-phone-input label="Switzerland" initial-country="CH"></ds-phone-input>
        <ds-phone-input label="Germany" initial-country="DE"></ds-phone-input>
        <ds-phone-input label="France" initial-country="FR"></ds-phone-input>
        <ds-phone-input label="Italy" initial-country="IT"></ds-phone-input>
        <ds-phone-input label="Restricted, no initial country" countries="CH,DE,FR,IT"></ds-phone-input>
        <!-- country is deliberately outside countries — expect a console warning and fallback to CH -->
        <ds-phone-input label="Mismatch fallback" countries="CH,DE" country="US"></ds-phone-input>
      </section>

      <!-- States -->
      <section data-testid="disabled">
        <span>Disabled</span>
        <ds-phone-input label="Disabled" initial-country="CH" disabled></ds-phone-input>
      </section>

      <section data-testid="readonly">
        <span>Readonly</span>
        <ds-phone-input label="Readonly" initial-country="CH" value="+41791234567" readonly></ds-phone-input>
      </section>

      <section data-testid="required">
        <span>Required</span>
        <ds-phone-input label="Required" initial-country="CH" required></ds-phone-input>
        <ds-phone-input label="Optional" initial-country="CH" required="false"></ds-phone-input>
      </section>

      <section data-testid="invalid">
        <span>Invalid</span>
        <ds-phone-input
          label="Invalid"
          initial-country="CH"
          invalid
          invalid-text="Please enter a phone number"
        ></ds-phone-input>
      </section>

      <section data-testid="invalid-slot">
        <span>Invalid Text Slot</span>
        <ds-phone-input label="Invalid slot" initial-country="CH" invalid>
          <span slot="invalid-text">Please include the country and national number</span>
        </ds-phone-input>
      </section>

      <section data-testid="valid">
        <span>Valid</span>
        <ds-phone-input label="Valid" initial-country="CH" value="+41791234567" color="success"></ds-phone-input>
      </section>

      <section data-testid="warning">
        <span>Warning</span>
        <ds-phone-input label="Warning" initial-country="CH" value="+41791234567" color="warning"></ds-phone-input>
      </section>

      <section data-testid="description">
        <span>Description</span>
        <ds-phone-input
          label="With description"
          initial-country="CH"
          description="Include the national number only"
        ></ds-phone-input>
      </section>

      <!-- Interaction -->
      <!-- Empty: type 791234567, expect live reformat, then blur to confirm final format. -->
      <section data-testid="empty">
        <span>Empty</span>
        <ds-phone-input label="Empty" initial-country="CH"></ds-phone-input>
      </section>

      <!-- Mid-typing is behavioral — type a partial number and confirm the cursor stays put. -->
      <section data-testid="mid-typing">
        <span>Mid-typing</span>
        <ds-phone-input label="Mid-typing" initial-country="CH"></ds-phone-input>
      </section>

      <section data-testid="formatted-value">
        <span>Fully formatted value</span>
        <ds-phone-input label="Formatted" initial-country="CH" value="+41791234567"></ds-phone-input>
      </section>

      <section data-testid="focused-trigger">
        <span>Focused country trigger</span>
        <ds-phone-input label="Keyboard focus" initial-country="CH" value="+41791234567"></ds-phone-input>
      </section>

      <section data-testid="focused-input">
        <span>Focused number input</span>
        <ds-phone-input label="Keyboard focus" initial-country="CH" value="+41791234567"></ds-phone-input>
      </section>

      <!-- Open the country picker with Enter/Space, filter by typing, arrows to navigate, Enter to select, Esc to close. -->
      <section data-testid="country-selection">
        <span>Country selection</span>
        <ds-phone-input label="Open the picker" initial-country="CH"></ds-phone-input>
      </section>

      <!-- Formatting -->
      <section data-testid="formatting">
        <span>Formatting</span>
        <ds-phone-input label="CH" initial-country="CH" value="+41791234567"></ds-phone-input>
        <ds-phone-input label="DE" initial-country="DE" value="+4915123456789"></ds-phone-input>
        <ds-phone-input label="FR" initial-country="FR" value="+33612345678"></ds-phone-input>
        <ds-phone-input label="IT" initial-country="IT" value="+393312345678"></ds-phone-input>
        <ds-phone-input label="US" initial-country="US" value="+12025551234"></ds-phone-input>
        <ds-phone-input label="JP" initial-country="JP" value="+819012345678"></ds-phone-input>
        <ds-phone-input label="FI (long calling code)" initial-country="FI" value="+358401234567"></ds-phone-input>
      </section>

      <!-- Form Reset -->
      <section data-testid="form-reset">
        <span>Form Reset</span>
        <form action="https://www.w3schools.com/action_page.php" target="_blank">
          <ds-phone-input
            required
            name="phone"
            label="Phone number"
            initial-country="CH"
            value="+41791234567"
          ></ds-phone-input>

          <ds-button-group>
            <ds-button element-type="submit" color="primary">Submit</ds-button>
            <ds-button data-testid="button-reset" element-type="reset" color="link">Reset</ds-button>
          </ds-button-group>
        </form>
      </section>
    </main>
  </body>
</html>
