<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/tokens/base.tokens.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <link rel="stylesheet" href="/assets/css/utilities.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="ds-container">
      <!-- Basic Style -->
      <section data-testid="basic">
        <span>Basic</span>
        <ds-counter label="Quantity" description="Choose between 0 and 10"></ds-counter>
        <ds-counter label="With Value" value="5"></ds-counter>
      </section>

      <!-- At Min Boundary -->
      <section data-testid="at-min">
        <span>At Min</span>
        <ds-counter label="At minimum" value="0" min="0" max="10"></ds-counter>
      </section>

      <!-- At Max Boundary -->
      <section data-testid="at-max">
        <span>At Max</span>
        <ds-counter label="At maximum" value="10" min="0" max="10"></ds-counter>
      </section>

      <!-- Disabled -->
      <section data-testid="disabled">
        <span>Disabled</span>
        <ds-counter label="Label" value="5" disabled></ds-counter>
      </section>

      <!-- Readonly -->
      <section data-testid="readonly">
        <span>Readonly</span>
        <ds-counter label="Label" value="5" readonly></ds-counter>
      </section>

      <!-- Invalid -->
      <section data-testid="invalid">
        <span>Invalid</span>
        <ds-counter label="Label" value="5" invalid-text="Out of allowed range" invalid></ds-counter>
      </section>

      <!-- Valid -->
      <section data-testid="valid">
        <span>Valid</span>
        <ds-counter label="Label" value="5" color="success"></ds-counter>
      </section>

      <!-- Warning -->
      <section data-testid="warning">
        <span>Warning</span>
        <ds-counter label="Label" value="5" color="warning"></ds-counter>
      </section>

      <!-- Custom Min/Max -->
      <section data-testid="min-max">
        <span>Min/Max</span>
        <ds-counter label="Range -5 to 5" min="-5" max="5" value="0"></ds-counter>
      </section>

      <!-- Decimal Step -->
      <section data-testid="decimal-step">
        <span>Decimal Step</span>
        <ds-counter label="Step 0.1" min="0" max="1" step="0.1" value="0"></ds-counter>
        <ds-counter label="Currency (step 0.05)" min="0" max="10" step="0.05" value="0"></ds-counter>
      </section>

      <!-- Larger Range -->
      <section data-testid="large-range">
        <span>Larger Range</span>
        <ds-counter label="0–1000, step 100" min="0" max="1000" step="100" value="500"></ds-counter>
      </section>

      <!-- Optional (required=false) -->
      <section data-testid="optional">
        <span>Optional</span>
        <ds-counter label="Optional" required="false" value="5"></ds-counter>
      </section>

      <!-- Form Reset -->
      <section data-testid="form-reset">
        <span>Form Reset</span>
        <form action="https://www.w3schools.com/action_page.php" target="_blank">
          <ds-counter required name="quantity" label="Quantity" value="3"></ds-counter>

          <ds-button-group>
            <ds-button element-type="submit" color="primary">Submit</ds-button>
            <ds-button data-testid="button-reset" element-type="reset" color="link">Reset</ds-button>
          </ds-button-group>
        </form>
      </section>
    </main>
  </body>
</html>
