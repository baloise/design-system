<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/tokens/base.tokens.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <link rel="stylesheet" href="/assets/css/utilities.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="ds-container">
      <!-- Basic Style -->
      <section data-testid="basic">
        <span>Basic</span>
        <ds-slider label="Volume" description="0–100"></ds-slider>
        <ds-slider label="Label" value="50"></ds-slider>
      </section>

      <!-- Disabled -->
      <section data-testid="disabled">
        <span>Disabled</span>
        <ds-slider label="Label" value="50" disabled></ds-slider>
      </section>

      <!-- Readonly -->
      <section data-testid="readonly">
        <span>Readonly</span>
        <ds-slider label="Label" value="50" readonly></ds-slider>
      </section>

      <!-- Invalid -->
      <section data-testid="invalid">
        <span>Invalid</span>
        <ds-slider label="Label" value="50" invalid-text="Out of range" invalid></ds-slider>
      </section>

      <!-- Invalid via slot (auto-detected, no invalid prop set) -->
      <section data-testid="invalid-slot">
        <span>Invalid via slot</span>
        <ds-slider label="Slot with content" value="50">
          <div slot="invalid-text">Slotted validation error</div>
        </ds-slider>
        <ds-slider label="Empty slot stays valid" value="50">
          <div slot="invalid-text"></div>
        </ds-slider>
      </section>

      <!-- Valid -->
      <section data-testid="valid">
        <span>Valid</span>
        <ds-slider label="Label" value="50" color="success"></ds-slider>
      </section>

      <!-- Warning -->
      <section data-testid="warning">
        <span>Warning</span>
        <ds-slider label="Label" value="50" color="warning"></ds-slider>
      </section>

      <!-- Brand Colors -->
      <section data-testid="brand-color">
        <span>Brand Color</span>
        <ds-slider label="Yellow" value="50" brand-color="yellow"></ds-slider>
        <ds-slider label="Purple" value="50" brand-color="purple"></ds-slider>
        <ds-slider label="Red" value="50" brand-color="red"></ds-slider>
        <ds-slider label="Green" value="50" brand-color="green"></ds-slider>
      </section>

      <!-- Step -->
      <section data-testid="step">
        <span>Step</span>
        <ds-slider label="Step 10" min="0" max="100" step="10"></ds-slider>
        <ds-slider label="Continuous" min="0" max="1" step="any"></ds-slider>
      </section>

      <!-- Min/Max -->
      <section data-testid="min-max">
        <span>Min/Max</span>
        <ds-slider label="Range -50 to 50" min="-50" max="50" value="0"></ds-slider>
      </section>

      <!-- Form Reset -->
      <section data-testid="form-reset">
        <span>Form Reset</span>
        <form action="https://www.w3schools.com/action_page.php" target="_blank">
          <ds-slider required name="volume" label="Volume" value="30"></ds-slider>

          <ds-button-group>
            <ds-button element-type="submit" color="primary">Submit</ds-button>
            <ds-button data-testid="button-reset" element-type="reset" color="link">Reset</ds-button>
          </ds-button-group>
        </form>
      </section>
    </main>
  </body>
</html>
