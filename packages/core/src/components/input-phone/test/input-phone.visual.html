<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />

    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <!-- Basic -->
      <section data-testid="basic">
        <span>Basic</span>
        <ds-input-phone label="Phone number"></ds-input-phone>
        <ds-input-phone label="Phone number" initial-country="CH"></ds-input-phone>
        <ds-input-phone label="Phone number" placeholder="79 123 45 67"></ds-input-phone>
      </section>

      <!-- Countries -->
      <section data-testid="countries">
        <span>Countries</span>
        <ds-input-phone label="Switzerland" initial-country="CH"></ds-input-phone>
        <ds-input-phone label="Germany" initial-country="DE"></ds-input-phone>
        <ds-input-phone label="France" initial-country="FR"></ds-input-phone>
        <ds-input-phone label="Italy" initial-country="IT"></ds-input-phone>
        <ds-input-phone label="Restricted, no initial country" countries="CH,DE,FR,IT"></ds-input-phone>
        <!-- country is deliberately outside countries — expect a console warning and fallback to CH -->
        <ds-input-phone label="Mismatch fallback" countries="CH,DE" country="US"></ds-input-phone>
      </section>

      <!-- States -->
      <section data-testid="disabled">
        <span>Disabled</span>
        <ds-input-phone label="Disabled" initial-country="CH" disabled></ds-input-phone>
      </section>

      <section data-testid="readonly">
        <span>Readonly</span>
        <ds-input-phone label="Readonly" initial-country="CH" value="+41791234567" readonly></ds-input-phone>
      </section>

      <section data-testid="required">
        <span>Required</span>
        <ds-input-phone label="Required" initial-country="CH" required></ds-input-phone>
        <ds-input-phone label="Optional" initial-country="CH" required="false"></ds-input-phone>
      </section>

      <section data-testid="invalid">
        <span>Invalid</span>
        <ds-input-phone
          label="Invalid"
          initial-country="CH"
          invalid
          invalid-text="Please enter a phone number"
        ></ds-input-phone>
      </section>

      <section data-testid="description">
        <span>Description</span>
        <ds-input-phone
          label="With description"
          initial-country="CH"
          description="Include the national number only"
        ></ds-input-phone>
      </section>

      <!-- Interaction -->
      <!-- Empty: type 791234567, expect live reformat, then blur to confirm final format. -->
      <section data-testid="empty">
        <span>Empty</span>
        <ds-input-phone label="Empty" initial-country="CH"></ds-input-phone>
      </section>

      <!-- Mid-typing is behavioral — type a partial number and confirm the cursor stays put. -->
      <section data-testid="mid-typing">
        <span>Mid-typing</span>
        <ds-input-phone label="Mid-typing" initial-country="CH"></ds-input-phone>
      </section>

      <section data-testid="formatted-value">
        <span>Fully formatted value</span>
        <ds-input-phone label="Formatted" initial-country="CH" value="+41791234567"></ds-input-phone>
      </section>

      <!-- Open the country picker with Enter/Space, filter by typing, arrows to navigate, Enter to select, Esc to close. -->
      <section data-testid="country-selection">
        <span>Country selection</span>
        <ds-input-phone label="Open the picker" initial-country="CH"></ds-input-phone>
      </section>

      <!-- Formatting -->
      <section data-testid="formatting">
        <span>Formatting</span>
        <ds-input-phone label="CH" initial-country="CH" value="+41791234567"></ds-input-phone>
        <ds-input-phone label="DE" initial-country="DE" value="+4915123456789"></ds-input-phone>
        <ds-input-phone label="FR" initial-country="FR" value="+33612345678"></ds-input-phone>
        <ds-input-phone label="IT" initial-country="IT" value="+393312345678"></ds-input-phone>
        <ds-input-phone label="US" initial-country="US" value="+12025551234"></ds-input-phone>
        <ds-input-phone label="JP" initial-country="JP" value="+819012345678"></ds-input-phone>
      </section>
    </main>
  </body>
</html>
