<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <section data-testid="primary">
        <span>Primary</span>
        <div class="flex">
          <div class="bg-primary-1 flex-1 h-4rem"></div>
          <div class="bg-primary-2 flex-1 h-4rem"></div>
          <div class="bg-primary-3 flex-1 h-4rem"></div>
          <div class="bg-primary-4 flex-1 h-4rem"></div>
          <div class="bg-primary-5 flex-1 h-4rem"></div>
          <div class="bg-primary-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="grey">
        <span>Grey</span>
        <div class="flex">
          <div class="bg-grey-1 flex-1 h-4rem"></div>
          <div class="bg-grey-2 flex-1 h-4rem"></div>
          <div class="bg-grey-3 flex-1 h-4rem"></div>
          <div class="bg-grey-4 flex-1 h-4rem"></div>
          <div class="bg-grey-5 flex-1 h-4rem"></div>
          <div class="bg-grey-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="sky">
        <span>Sky</span>
        <div class="flex">
          <div class="bg-sky-1 flex-1 h-4rem"></div>
          <div class="bg-sky-2 flex-1 h-4rem"></div>
          <div class="bg-sky-3 flex-1 h-4rem"></div>
          <div class="bg-sky-4 flex-1 h-4rem"></div>
          <div class="bg-sky-5 flex-1 h-4rem"></div>
          <div class="bg-sky-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="purple">
        <span>Purple</span>
        <div class="flex">
          <div class="bg-purple-1 flex-1 h-4rem"></div>
          <div class="bg-purple-2 flex-1 h-4rem"></div>
          <div class="bg-purple-3 flex-1 h-4rem"></div>
          <div class="bg-purple-4 flex-1 h-4rem"></div>
          <div class="bg-purple-5 flex-1 h-4rem"></div>
          <div class="bg-purple-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="green">
        <span>Green</span>
        <div class="flex">
          <div class="bg-green-1 flex-1 h-4rem"></div>
          <div class="bg-green-2 flex-1 h-4rem"></div>
          <div class="bg-green-3 flex-1 h-4rem"></div>
          <div class="bg-green-4 flex-1 h-4rem"></div>
          <div class="bg-green-5 flex-1 h-4rem"></div>
          <div class="bg-green-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="red">
        <span>Red</span>
        <div class="flex">
          <div class="bg-red-1 flex-1 h-4rem"></div>
          <div class="bg-red-2 flex-1 h-4rem"></div>
          <div class="bg-red-3 flex-1 h-4rem"></div>
          <div class="bg-red-4 flex-1 h-4rem"></div>
          <div class="bg-red-5 flex-1 h-4rem"></div>
          <div class="bg-red-6 flex-1 h-4rem"></div>
        </div>
      </section>

      <section data-testid="yellow">
        <span>Yellow</span>
        <div class="flex">
          <div class="bg-yellow-1 flex-1 h-4rem"></div>
          <div class="bg-yellow-2 flex-1 h-4rem"></div>
          <div class="bg-yellow-3 flex-1 h-4rem"></div>
          <div class="bg-yellow-4 flex-1 h-4rem"></div>
          <div class="bg-yellow-5 flex-1 h-4rem"></div>
          <div class="bg-yellow-6 flex-1 h-4rem"></div>
        </div>
      </section>
    </main>
  </body>
</html>
