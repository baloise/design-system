<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <section data-testid="composite">
        <span>Composite</span>
        <div class="flex gap-sm mb-sm">
          <div class="border-grey p-sm"><span>grey</span></div>
          <div class="border-grey-dashed p-sm"><span>grey-dashed</span></div>
          <div class="border-grey-dark p-sm"><span>grey-dark</span></div>
          <div class="border-grey-dark-dashed p-sm"><span>grey-dark-dashed</span></div>
          <div class="border-grey-light p-sm"><span>grey-light</span></div>
        </div>
        <div class="flex gap-sm mb-sm">
          <div class="border-primary p-sm"><span>primary</span></div>
          <div class="border-primary-light p-sm"><span>primary-light</span></div>
          <div class="border-primary-dashed p-sm"><span>primary-dashed</span></div>
        </div>
        <div class="flex gap-sm mb-sm">
          <div class="border-warning p-sm"><span>warning</span></div>
          <div class="border-success p-sm"><span>success</span></div>
          <div class="border-info p-sm"><span>info</span></div>
          <div class="border-danger p-sm"><span>danger</span></div>
        </div>
        <div class="flex gap-sm">
          <div class="bg-primary-6 border-white p-sm"><span>white</span></div>
          <div class="bg-primary-6 border-white-dashed p-sm"><span>white-dashed</span></div>
          <div class="border-transparent p-sm"><span>transparent</span></div>
          <div class="border-disabled p-sm"><span>disabled</span></div>
        </div>
      </section>

      <section data-testid="sides">
        <span>Sides</span>
        <div class="flex">
          <div class="border-top-primary p-sm"><span>top</span></div>
          <div class="border-bottom-primary p-sm"><span>bottom</span></div>
          <div class="border-left-primary p-sm"><span>left</span></div>
          <div class="border-right-primary p-sm"><span>right</span></div>
        </div>
      </section>

      <section data-testid="width">
        <span>Width</span>
        <div class="flex">
          <div class="border-primary border-width-none p-sm"><span>none</span></div>
          <div class="border-primary border-width-base p-sm"><span>base</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
