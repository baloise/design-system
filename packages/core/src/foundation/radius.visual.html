<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <section data-testid="size">
        <span>Size</span>
        <div class="flex gap-sm">
          <div class="radius-none border-primary p-sm"><span>none</span></div>
          <div class="radius border-primary p-sm"><span>base</span></div>
          <div class="radius-lg border-primary p-sm"><span>lg</span></div>
          <div class="radius-rounded border-primary p-sm"><span>rounded</span></div>
        </div>
      </section>

      <section data-testid="corners">
        <span>Corners</span>
        <div class="flex gap-sm">
          <div class="radius-top-lg border-primary p-sm"><span>top</span></div>
          <div class="radius-bottom-lg border-primary p-sm"><span>bottom</span></div>
          <div class="radius-top-left-lg border-primary p-sm"><span>top-left</span></div>
          <div class="radius-top-right-lg border-primary p-sm"><span>top-right</span></div>
          <div class="radius-bottom-left-lg border-primary p-sm"><span>bottom-left</span></div>
          <div class="radius-bottom-right-lg border-primary p-sm"><span>bottom-right</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
