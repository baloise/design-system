<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <link rel="stylesheet" href="/assets/section.css" />
    <link rel="stylesheet" href="/assets/css/design-system.local.min.css" />
    <script type="module" src="/build/design-system.esm.js"></script>
    <script nomodule src="/build/design-system.js"></script>
  </head>
  <body>
    <main class="container">
      <section data-testid="padding">
        <span>Padding</span>
        <div class="flex">
          <div class="p-none bg-red-1"><span>none</span></div>
          <div class="p-2xs bg-red-2"><span>2xs</span></div>
          <div class="p-xs bg-red-3"><span>xs</span></div>
          <div class="p-sm bg-red-4"><span>sm</span></div>
          <div class="p-base bg-red-5"><span>base</span></div>
          <div class="p-md bg-red-6"><span>md</span></div>
          <div class="p-lg bg-red-1"><span>lg</span></div>
          <div class="p-xl bg-red-2"><span>xl</span></div>
          <div class="p-2xl bg-red-3"><span>2xl</span></div>
          <div class="p-3xl bg-red-4"><span>3xl</span></div>
          <div class="p-4xl bg-red-5"><span>4xl</span></div>
        </div>
      </section>

      <section data-testid="margin-auto">
        <span>Margin auto</span>
        <div class="flex bg-purple-2" style="width: 200px">
          <div class="m-auto bg-purple-3"><span>auto</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
