name: 🔄 Sync Tokens from Studio

on:
  repository_dispatch:
    types: [tokens-release-packaged]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}

jobs:
  SyncTokens:
    name: 🔄 Sync Tokens from Studio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.PRE_RELEASE_GITHUB_TOKEN }}

      - uses: ./.github/workflows/actions/setup-environment

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull tokens from Studio
        id: fetch
        shell: bash
        env:
          TOKENS_STUDIO_API_KEY: ${{ secrets.TOKEN_STUDIO_API_TOKEN }}
        run: npx tokensstudio pull --host graphql.prod.tokens.studio

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- packages/tokens/tokens; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tokens
        if: steps.diff.outputs.changed == 'true'
        run: pnpm tokens

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PRE_RELEASE_GITHUB_TOKEN }}
          commit-message: 'chore(tokens): sync tokens from Token Studio release'
          branch: tokens/studio-sync
          delete-branch: true
          title: '🎨 Sync design tokens from Token Studio'
          body: |
            Automated token sync triggered by a `release.packaged` event from Token Studio.

            This PR was opened automatically — review the generated diff and let visual regression CI run before merging.
          add-paths: |
            packages/tokens/tokens/*.tokens.json
