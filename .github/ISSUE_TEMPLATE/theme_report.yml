name: 🎨 Theme Report
description: Request a new brand/theme for the Design System
title: ':art: theme(brand): title'
labels: ['✨ feature']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this report! New brands/themes (e.g. ERV, TCS)
        are added as a token override on top of the base design tokens — the more brand
        guideline detail you can provide below, the faster this can be scoped.
  - type: input
    id: brand-name
    attributes:
      label: Brand / Theme Name
      description: The name of the brand this theme should represent.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Which application(s) need this brand, and why can't an existing theme be used?
    validations:
      required: true
  - type: textarea
    id: brand-guidelines
    attributes:
      label: Brand Guidelines
      description: Link to the brand's style guide, Figma file, or design tokens (colors, typography, logo, etc.) if available.
  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Please include any additional information that may be relevant to your request.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/baloise/design-system?tab=coc-ov-file)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
