<h2>Phone input demo</h2>

<p data-testid="phone-value">Phone value: {{ phoneValue() }}</p>
<ds-phone-input
  data-testid="phone"
  name="smoke-test-phone"
  initial-country="CH"
  [value]="phoneValue()"
  (dsInput)="onInput($event)"
/>

<form [formGroup]="reactiveForm">
  <ds-phone-input data-testid="reactive-phone" name="reactive-phone" label="Phone" formControlName="phone" />
</form>
<p data-testid="reactive-phone-value">Reactive value: {{ reactiveForm.controls.phone.value }}</p>
<button data-testid="toggle-reactive-phone-disabled" type="button" (click)="toggleReactiveFormDisabled()">
  Toggle disabled
</button>
<button data-testid="set-reactive-phone-value" type="button" (click)="setReactiveFormValue()">
  Set to +41 79 876 54 32
</button>

<form [formGroup]="autoInvalidOffForm">
  <ds-phone-input
    data-testid="auto-invalid-off-phone"
    name="auto-invalid-off-phone"
    label="Phone (auto-invalid off)"
    formControlName="phone"
    autoInvalidOff
  />
</form>
