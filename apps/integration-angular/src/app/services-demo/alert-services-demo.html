<h2>Toast &amp; snackbar demo</h2>
<p data-testid="alert-closed">Closed by user: {{ closed() }}</p>
<ds-button data-testid="open-toast" (dsClick)="openToast()">Open toast</ds-button>
<ds-button data-testid="open-snackbar" (dsClick)="openSnackbar()">Open snackbar</ds-button>
<ds-button data-testid="dismiss-toast" (dsClick)="dismissToast()">Dismiss toast</ds-button>
<ds-button data-testid="dismiss-snackbar" (dsClick)="dismissSnackbar()">Dismiss snackbar</ds-button>
<ds-button data-testid="dismiss-all" (dsClick)="dismissAll()">Dismiss all</ds-button>
