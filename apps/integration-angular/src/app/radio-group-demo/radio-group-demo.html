<h2>Radio group demo</h2>

<p data-testid="radio-group-value">Radio group value: {{ radioGroupValue() }}</p>
<ds-radio-group
  data-testid="radio-group"
  name="smoke-test-plan"
  label="Plan"
  [value]="radioGroupValue()"
  (dsChange)="onChange($event)"
>
  <ds-radio value="basic" label="Basic">Basic</ds-radio>
  <ds-radio value="premium" label="Premium">Premium</ds-radio>
</ds-radio-group>

<form [formGroup]="reactiveForm">
  <ds-radio-group
    data-testid="reactive-radio-group"
    name="reactive-radio-group"
    label="Plan"
    allowEmptySelection
    formControlName="plan"
  >
    <ds-radio data-testid="reactive-radio-basic" value="basic" label="Basic">Basic</ds-radio>
    <ds-radio data-testid="reactive-radio-premium" value="premium" label="Premium">Premium</ds-radio>
  </ds-radio-group>
</form>
<p data-testid="reactive-radio-value">Reactive value: {{ reactiveForm.controls.plan.value }}</p>
<button data-testid="toggle-reactive-radio-disabled" type="button" (click)="toggleReactiveFormDisabled()">
  Toggle disabled
</button>
<button data-testid="set-reactive-radio-value" type="button" (click)="setReactiveFormValue()">Set to premium</button>

<form [formGroup]="autoInvalidOffForm">
  <ds-radio-group
    data-testid="auto-invalid-off-radio-group"
    name="auto-invalid-off-radio-group"
    label="Plan"
    allowEmptySelection
    autoInvalidOff
    formControlName="plan"
  >
    <ds-radio data-testid="auto-invalid-off-radio-basic" value="basic" label="Basic">Basic</ds-radio>
    <ds-radio data-testid="auto-invalid-off-radio-premium" value="premium" label="Premium">Premium</ds-radio>
  </ds-radio-group>
</form>
