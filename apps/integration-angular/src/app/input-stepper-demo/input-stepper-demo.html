<h2>Input stepper demo</h2>

<p data-testid="input-stepper-value">Input stepper value: {{ inputStepperValue() }}</p>
<ds-input-stepper
  data-testid="input-stepper"
  name="smoke-test-input-stepper"
  label="Quantity"
  [value]="inputStepperValue()"
  (dsChange)="onChange($event)"
/>

<form [formGroup]="reactiveForm">
  <ds-input-stepper
    data-testid="reactive-input-stepper"
    name="reactive-input-stepper"
    label="Quantity"
    formControlName="quantity"
  />
</form>
<p data-testid="reactive-input-stepper-value">Reactive value: {{ reactiveForm.controls.quantity.value }}</p>
<button data-testid="toggle-reactive-input-stepper-disabled" type="button" (click)="toggleReactiveFormDisabled()">
  Toggle disabled
</button>
<button data-testid="set-reactive-input-stepper-value" type="button" (click)="setReactiveFormValue()">Set to 7</button>
<button data-testid="reset-reactive-input-stepper" type="button" (click)="resetReactiveForm()">Reset</button>

<form [formGroup]="nullableForm">
  <ds-input-stepper
    data-testid="nullable-input-stepper"
    name="nullable-input-stepper"
    label="Quantity"
    formControlName="quantity"
  />
</form>
<button data-testid="reset-nullable-input-stepper" type="button" (click)="resetNullableForm()">Reset nullable</button>

<form [formGroup]="autoInvalidOffForm">
  <ds-input-stepper
    data-testid="auto-invalid-off-input-stepper"
    name="auto-invalid-off-input-stepper"
    label="Quantity"
    autoInvalidOff
    formControlName="quantity"
  />
</form>
