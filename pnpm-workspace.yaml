packages:
  - 'apps/*'
  - 'packages/*'
  - 'libs/*'
  - '!apps/integration-aem'

linkWorkspacePackages: true

# Single source of truth for versions shared across multiple workspace
# packages. Reference an entry from a package.json with "catalog:".
# pnpm replaces "catalog:" with the resolved version on publish.
catalog:
  '@axe-core/playwright': 4.13.0
  '@stencil/core': 4.44.2
  '@storybook/addon-docs': 10.5.10
  '@storybook/addon-links': 10.5.10
  '@storybook/html-vite': 10.5.10
  '@typescript-eslint/utils': 8.68.0
  compression: 1.8.1
  eslint: 10.9.1
  express: 5.2.1
  fast-deep-equal: 3.1.3
  fs-extra: 11.4.0
  lodash: 4.18.1
  sass: 1.103.1
  serve-index: 1.9.2
  storybook: 10.5.2
  tslib: 2.8.1
  tsx: 4.23.12
  typescript: 5.6.3
  vite: 8.2.2
  vitest: 4.1.11

# Kept in sync with package.json's "pnpm.overrides" — pnpm 11 reads
# overrides from here locally, but Vercel's install only picks up the
# copy in package.json (frozen-lockfile broke there without it).
# See docs/adr/0005-duplicate-pnpm-overrides.md
overrides:
  'brace-expansion@<5.0.9': 5.0.9
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'immutable@>=5.0.0-beta.1 <5.1.8': 5.1.8
  'sharp@<0.35.0': 0.35.3
  'postcss@<8.5.23': 8.5.26
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  '@hono/node-server@<2.0.5': 2.1.0
  'hono@<4.12.34': 4.13.1
  'nanoid@<3.3.18': 3.3.18
  'browserslist@<4.28.7': 4.28.8

# Dependency lifecycle scripts are blocked by default (strictDepBuilds).
# These native-build packages are explicitly allowed to run their scripts.
# pnpm 11 replaced the `onlyBuiltDependencies` list with the `allowBuilds` map.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  libxmljs2: true
  sharp: true
  unrs-resolver: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - hono@4.13.1
