packages:
  - 'apps/*'
  - 'packages/*'
  - 'libs/*'
  - '!apps/integration-aem'

linkWorkspacePackages: true

# Single source of truth for versions shared across multiple workspace
# packages. Reference an entry from a package.json with "catalog:".
# pnpm replaces "catalog:" with the resolved version on publish.
catalog:
  '@axe-core/playwright': 4.13.0
  '@stencil/core': 4.45.1
  '@storybook/addon-docs': 10.6.1
  '@storybook/addon-links': 10.6.1
  '@storybook/html-vite': 10.6.1
  '@typescript-eslint/utils': 8.71.0
  compression: 1.8.2
  eslint: 10.11.0
  express: 5.2.1
  fast-deep-equal: 3.1.3
  fs-extra: 11.4.1
  lodash: 4.18.1
  sass: 1.105.1
  serve-index: 1.9.2
  storybook: 10.6.0
  tslib: 2.8.1
  tsx: 4.23.15
  typescript: 5.6.3
  vite: 8.3.2
  vitest: 4.1.11

# Dependency lifecycle scripts are blocked by default (strictDepBuilds).
# These native-build packages are explicitly allowed to run their scripts.
# pnpm 11 replaced the `onlyBuiltDependencies` list with the `allowBuilds` map.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  libxmljs2: true
  sharp: true
  unrs-resolver: true
  lmdb: true
  msgpackr-extract: true

# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, DoS via deeply nested patterns) has no
# fixed release on npm yet (3.0.4 was never published) and micromatch pins
# ^3.0.3. braces is only reached through build/dev tooling (fast-glob, shadcn).
# Remove this entry once a patched version exists. Tracking: https://github.com/baloise/design-system/issues/2392
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
