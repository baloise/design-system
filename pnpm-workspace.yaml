packages:
  - 'packages/*'
  - 'libs/*'
  - 'docs'

linkWorkspacePackages: true

# Single source of truth for versions shared across multiple workspace
# packages. Reference an entry from a package.json with "catalog:".
# pnpm replaces "catalog:" with the resolved version on publish.
catalog:
  '@axe-core/playwright': 4.12.1
  '@stencil/core': 4.43.5
  '@storybook/addon-docs': 10.5.2
  '@storybook/addon-links': 10.5.2
  '@storybook/html-vite': 10.5.2
  '@typescript-eslint/utils': 8.64.0
  compression: 1.8.1
  eslint: 10.7.0
  express: 5.2.1
  fast-deep-equal: 3.1.3
  fs-extra: 11.3.6
  lodash: 4.18.1
  sass: 1.101.0
  serve-index: 1.9.2
  storybook: 10.5.2
  tslib: 2.8.1
  tsx: 4.23.1
  typescript: 5.6.3
  vite: 8.1.5
  vitest: 4.1.10

overrides:
  '@swc/cli>minimatch@9>brace-expansion': 2.1.2

# Dependency lifecycle scripts are blocked by default (strictDepBuilds).
# These native-build packages are explicitly allowed to run their scripts.
# pnpm 11 replaced the `onlyBuiltDependencies` list with the `allowBuilds` map.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  libxmljs2: true
